[package]
name = "nautilus-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nautilus-server"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
axum = { version = "0.7", features = ["macros"] }
rand = "0.8"
# default-features = false + rustls-tls: avoids pulling in openssl-sys, which is painful to
# statically link under musl (the target we cross-compile to for the enclave image).
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1.0"
serde_yaml = "0.9"
tower-http = { version = "0.6", features = ["cors"] }

# k256 + sha3 instead of a full alloy/ethers stack: we only need secp256k1 signing and keccak256.
# Hand-rolled EIP-712 (see src/eip712.rs) is ~200 lines and avoids a heavy dependency tree.
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
hex = "0.4"

nsm_api = { git = "https://github.com/aws/aws-nitro-enclaves-nsm-api.git", rev = "8ec7eac72bbb2097f1058ee32c13e1ff232f13e8", package = "aws-nitro-enclaves-nsm-api" }

# Hand-rolled AWS SigV4 (hmac+sha2+chrono) plus manual CMS/RSA-OAEP/AES-CBC decrypt, instead of
# aws-sdk-kms: that SDK's MSRV is newer than the toolchain pinned in rust-toolchain.toml.
hmac = "0.12"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rsa = { version = "0.9", features = ["sha2"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"

[features]
ping = []
dice = []
